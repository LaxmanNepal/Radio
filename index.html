<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nepali Radio Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#fff;color:#333;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden;touch-action:manipulation}
.vfx-bg{position:fixed;inset:0;z-index:-1;overflow:hidden}.vfx-circle{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(67,97,238,.15),transparent 70%);animation:pulse 12s infinite}
.splash-screen{position:fixed;inset:0;background:linear-gradient(135deg,#3a0ca3,#4361ee);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;animation:fadeOut 1s 2s forwards}
.splash-logo{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:30px;animation:pulse 2s infinite}.splash-logo i{font-size:60px;color:#4361ee}.splash-text{font-size:28px;font-weight:700;color:#fff;letter-spacing:2px;text-align:center}.splash-subtext{color:#fffC;margin-top:10px}
.app-container{width:100%;max-width:480px;height:100vh;max-height:900px;background:#fff;border-radius:20px;box-shadow:0 20px 50px #0001;overflow:hidden;display:flex;flex-direction:column;position:relative;border:1px solid #f0f0f0;opacity:0;transform:scale(.95);animation:scaleIn .8s 2.2s forwards}
.app-bar{height:70px;display:flex;align-items:center;padding:0 24px;background:linear-gradient(to right,#4361ee,#3a0ca3);color:#fff;box-shadow:0 2px 10px #0002;z-index:10}.app-bar-title{font-size:1.5rem;font-weight:600;margin-left:10px}.app-bar-time{margin-left:auto;background:#fff2;padding:6px 12px;border-radius:20px;font-weight:500}
.content{flex:1;overflow-y:auto;padding:24px;background:#fff;-webkit-overflow-scrolling:touch}.player-section{display:flex;flex-direction:column;align-items:center;padding:20px 0}.station-info{text-align:center;margin-bottom:24px;width:100%}.station-name{font-size:1.8rem;font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 20px;color:#3a0ca3}.station-frequency{font-size:1.2rem;color:#4a4a4a;font-weight:500;opacity:.8}.status-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}.indicator-dot{width:12px;height:12px;border-radius:50%;background:#4caf50;box-shadow:0 0 8px #4caf5080;animation:pulse 1.5s infinite}.status-text{font-size:1rem;font-weight:500;color:#4a4a4a}
.visualizer-container{width:100%;height:100px;display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-bottom:24px;padding:0 10px}.bar{width:8px;background:linear-gradient(to top,#4361ee,#4cc9f0);border-radius:4px 4px 0 0;transition:height .2s}
.controls{display:flex;justify-content:center;align-items:center;gap:32px;margin-bottom:24px}.control-button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#4361ee;border:0;box-shadow:0 4px 10px #0002;cursor:pointer}.play-button{width:72px;height:72px;background:linear-gradient(to right,#4361ee,#3a0ca3);color:#fff;box-shadow:0 8px 20px #4361ee4d}.play-button:active{transform:scale(.95)}
.volume-control{display:flex;align-items:center;gap:16px;width:100%;max-width:300px;margin:auto}.volume-icon{color:#4361ee;font-size:1.2rem}.volume-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:#e0e0e0;outline:0}.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#4361ee;cursor:pointer;box-shadow:0 2px 6px #0003}
.view-section{position:absolute;inset:0;background:#fff;transform:translateY(100%);transition:transform .5s cubic-bezier(.4,0,.2,1);z-index:20;display:flex;flex-direction:column}.view-section.active{transform:translateY(0)}.section-header{display:flex;align-items:center;padding:16px 24px;background:#fff;box-shadow:0 2px 4px #0000000d;z-index:30}.back-button{background:0;border:0;color:#4361ee;font-size:1.5rem;cursor:pointer;margin-right:16px}.section-title{font-size:1.4rem;font-weight:600}.search-container{padding:10px 24px;background:#f8f9fa;border-bottom:1px solid #eaeaea}.search-box{width:100%;padding:12px 20px;border-radius:30px;border:1px solid #e0e0e0;background:#fff;font-size:1rem;box-shadow:0 2px 8px #0000000d;outline:0}.search-box:focus{border-color:#4361ee}.stations-list{flex:1;overflow-y:auto;padding:16px 24px}.station-item{display:flex;align-items:center;padding:16px;border-radius:12px;margin-bottom:12px;background:#fff;box-shadow:0 2px 8px #0000000d;border:1px solid #f0f0f0;cursor:pointer;animation:slideUp .5s forwards;position:relative}.station-icon{width:50px;height:50px;border-radius:12px;background:linear-gradient(to right,#4361ee,#3a0ca3);display:grid;place-items:center;color:#fff;margin-right:16px;font-size:1.2rem}.station-info{flex:1}.station-item-name{font-weight:600;margin-bottom:4px}.station-item-frequency{font-size:.9rem;color:#4361ee;font-weight:500}.station-item .control-button{width:42px;height:42px}
.bottom-nav{height:80px;display:flex;background:#fff;box-shadow:0 -2px 10px #0000000d;padding:0 16px;z-index:20}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;text-decoration:none;font-size:.8rem;cursor:pointer;position:relative}.nav-item.active{color:#4361ee}.nav-icon{font-size:1.5rem;margin-bottom:4px;color:#999}.nav-item.active .nav-icon{color:#4361ee;transform:translateY(-5px)}.nav-item.active:after{content:"";position:absolute;bottom:0;width:100%;height:3px;background:linear-gradient(to right,#4361ee,#3a0ca3)}
.spinner{width:24px;height:24px;border:3px solid #4361ee4d;border-radius:50%;border-top-color:#4361ee;animation:spin 1s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}@keyframes scaleIn{to{opacity:1;transform:scale(1)}}@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:480px){.station-name{font-size:1.5rem}.app-bar-title{font-size:1.2rem}.visualizer-container{height:80px}.controls{gap:24px}.control-button{width:50px;height:50px}.play-button{width:64px;height:64px}.station-item{padding:12px}.nav-item{font-size:.7rem}.nav-icon{font-size:1.3rem}}
</style>
</head>
<body>
<div class="vfx-bg" id="vfx-bg"></div>
<div class="splash-screen"><div class="splash-logo"><i class="fas fa-radio"></i></div><div class="splash-text">नेपाली रेडियो</div><div class="splash-subtext">Connecting Nepal through music</div></div>
<div class="app-container">
<div class="app-bar"><div class="app-bar-title">नेपाली रेडियो</div><div class="app-bar-time" id="current-time"></div></div>
<div class="content"><div class="player-section">
<div class="station-info"><div class="station-name" id="current-station">Radio Nepal</div><div class="station-frequency" id="station-frequency">FM 98.6</div></div>
<div class="status-indicator"><div class="indicator-dot"></div><div class="status-text" id="status-text">Connecting...</div><div class="spinner" id="loading-spinner"></div></div>
<div class="visualizer-container" id="visualizer"></div>
<div class="controls"><button class="control-button" id="prev-btn"><i class="fas fa-step-backward"></i></button><button class="control-button play-button" id="play-btn"><i class="fas fa-play" id="play-icon"></i></button><button class="control-button" id="next-btn"><i class="fas fa-step-forward"></i></button></div>
<div class="volume-control"><i class="fas fa-volume-up volume-icon"></i><input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80"></div>
</div></div>
<div class="view-section" id="stations-section"><div class="section-header"><button class="back-button" id="back-button-stations"><i class="fas fa-arrow-left"></i></button><div class="section-title">All Stations</div></div><div class="search-container"><input class="search-box" id="station-search" placeholder="Search stations..."></div><div class="stations-list" id="stations-list"></div></div>
<div class="bottom-nav"><div class="nav-item active" data-view="home"><i class="fas fa-home nav-icon"></i><span>Home</span></div><div class="nav-item" data-view="radio"><i class="fas fa-radio nav-icon"></i><span>Stations</span></div></div>
</div>
<script>
const stations=[
{id:1,name:"Radio Nepal",frequency:"FM 98.6",icon:"fas fa-microphone",streamUrl:"https://stream1.radionepal.gov.np/live/"},
{id:2,name:"Kantipur FM",frequency:"FM 96.1",icon:"fas fa-music",streamUrl:"https://radio-broadcast.ekantipur.com/stream/"},
{id:3,name:"Ujyalo 90",frequency:"FM 90.0",icon:"fas fa-sun",streamUrl:"https://stream.zeno.fm/h527zwd11uquv"},
{id:4,name:"Kalika FM",frequency:"FM 105.4",icon:"fas fa-mountain",streamUrl:"http://kalika-stream.softnep.com:7740/;"},
{id:5,name:"Galyang FM",frequency:"FM 106.0",icon:"fas fa-tree",streamUrl:"https://live.itech.host:9107/stream"},
{id:6,name:"Hits FM",frequency:"FM 91.2",icon:"fas fa-headphones",streamUrl:"https://stream.zeno.fm/0c4f3b1e9kquv"},
{id:7,name:"Sagarmatha FM",frequency:"FM 102.4",icon:"fas fa-mountain",streamUrl:"https://stream.zeno.fm/7r8f3a2m1kquv"},
{id:8,name:"Classic FM",frequency:"FM 94.4",icon:"fas fa-compact-disc",streamUrl:"https://stream.zeno.fm/1a8f3b1e9kquv"},
{id:9,name:"News FM",frequency:"FM 103.8",icon:"fas fa-newspaper",streamUrl:"https://stream.zeno.fm/2b8f3b1e9kquv"},
{id:10,name:"Metro FM",frequency:"FM 95.6",icon:"fas fa-city",streamUrl:"https://stream.zeno.fm/3c8f3b1e9kquv"},
{id:11,name:"Lumbini FM",frequency:"FM 97.2",icon:"fas fa-pagelines",streamUrl:"https://stream.zeno.fm/4d8f3b1e9kquv"},
{id:12,name:"Annapurna FM",frequency:"FM 88.6",icon:"fas fa-mountain",streamUrl:"https://stream.zeno.fm/5e8f3b1e9kquv"}];
let currentStationIndex=0,isPlaying=false,bars=[],audio=new Audio(),animationId;
const $=id=>document.getElementById(id),stationName=$("current-station"),frequency=$("station-frequency"),status=$("status-text"),playBtn=$("play-btn"),playIcon=$("play-icon"),visualizer=$("visualizer"),stationsSection=$("stations-section"),stationsList=$("stations-list"),search=$("station-search"),spinner=$("loading-spinner");
function createBars(){visualizer.innerHTML="";bars=[];for(let i=0;i<40;i++){let b=document.createElement("div");b.className="bar";b.style.height="5px";visualizer.appendChild(b);bars.push(b)}}
function visualize(){bars.forEach((b,i)=>b.style.height=isPlaying?Math.max(5,Math.random()*60+Math.sin(i*.3+Date.now()/200)*5)+"px":"5px");animationId=requestAnimationFrame(visualize)}
function render(filter=""){stationsList.innerHTML="";stations.filter(s=>(s.name+" "+s.frequency).toLowerCase().includes(filter.toLowerCase())).forEach((s,i)=>{let el=document.createElement("div");el.className="station-item";el.innerHTML='<div class="station-icon"><i class="'+s.icon+'"></i></div><div class="station-info"><div class="station-item-name">'+s.name+'</div><div class="station-item-frequency">'+s.frequency+'</div></div><button class="control-button"><i class="'+(i===currentStationIndex&&isPlaying?"fas fa-pause":"fas fa-play")+'"></i></button>';el.onclick=()=>{selectStation(stations.indexOf(s));showView("home")};stationsList.appendChild(el)})}
function display(){let s=stations[currentStationIndex];stationName.textContent=s.name;frequency.textContent=s.frequency;playIcon.className=isPlaying?"fas fa-pause":"fas fa-play";status.textContent=isPlaying?"Now Playing":"Paused";render(search.value)}
function loadStation(i){spinner.style.display="block";status.textContent="Connecting...";audio.pause();isPlaying=false;currentStationIndex=i;audio.src=stations[i].streamUrl;audio.load();display();audio.play().then(()=>{isPlaying=true;spinner.style.display="none";display();if(!animationId)visualize()}).catch(()=>{spinner.style.display="none";status.textContent="Click Play to Start";display()})}
function play(){audio.play().then(()=>{isPlaying=true;display()}).catch(()=>status.textContent="Click Play to Start")}
function pause(){audio.pause();isPlaying=false;display()}
function toggle(){isPlaying?pause():play()}
function selectStation(i){loadStation(i)}
function showView(v){stationsSection.classList.toggle("active",v==="radio");document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.view===v));if(v==="radio")setTimeout(()=>search.focus(),300)}
$("play-btn").onclick=toggle;$("prev-btn").onclick=()=>loadStation((currentStationIndex-1+stations.length)%stations.length);$("next-btn").onclick=()=>loadStation((currentStationIndex+1)%stations.length);$("volume-slider").oninput=e=>audio.volume=e.target.value/100;$("back-button-stations").onclick=()=>showView("home");document.querySelectorAll(".nav-item").forEach(n=>n.onclick=()=>showView(n.dataset.view));search.oninput=()=>render(search.value);
audio.onwaiting=()=>{status.textContent="Buffering...";spinner.style.display="block"};audio.onplaying=()=>{status.textContent="Now Playing";spinner.style.display="none"};audio.onerror=()=>{status.textContent="Connection Error";spinner.style.display="none"};
function time(){let d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0");$("current-time").textContent=(h%12||12)+":"+m+" "+(h>=12?"PM":"AM")} 
function init(){createBars();render();audio.volume=.8;time();setInterval(time,1000);for(let i=0;i<15;i++){let c=document.createElement("div");c.className="vfx-circle";let s=Math.random()*300+100;c.style.width=c.style.height=s+"px";c.style.left=Math.random()*100+"%";c.style.top=Math.random()*100+"%";c.style.animationDelay=Math.random()*5+"s";$("vfx-bg").appendChild(c)}loadStation(0)}
window.addEventListener("load",init);
</script>
</body>
</html>
